name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "../../../src/DevOpsSample.Api/DevOpsSample.Api.csproj"

      - name: Build
        run: dotnet build "../../../src/DevOpsSample.Api/DevOpsSample.Api.csproj" --no-restore --configuration Release

      - name: Test
        run: dotnet test "../../../tests/DevOpsSample.Api.Tests/DevOpsSample.Api.Tests.csproj" --no-build --configuration Release --verbosity normal
